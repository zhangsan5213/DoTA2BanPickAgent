# BP Agent Training Configuration

# Training hyperparameters
actor_lr: 3e-4

# Loss coefficients (relative to actor = 1.0)
value_loss_coeff: 2.0    # value_loss coefficient
entropy_loss_coeff: 0.03  # entropy_loss coefficient

# TensorBoard
tensorboard_log_prefix: "bp_agent_exp_"

# Rating/Evaluation config
rating:
  method: "trueskill"  # "elo" or "trueskill"
  eval_interval: 2      # evaluate every N epochs
  num_opponents: 8      # opponents per evaluation
  num_player_sets: 16   # player sets per opponent

  # ELO-specific config
  elo:
    k_factor: 32
    initial_rating: 1500
    scale: 400
    opponent_sample_std: 200

  # TrueSkill-specific config
  trueskill:
    initial_mu: 25.0
    initial_sigma: 8.33
    beta: 4.17
    tau: 0.083
    draw_probability: 0.0
    opponent_sample_std: 2.0
    staleness_threshold: 4
    num_active_models: 5

# Training defaults (used in __main__)
training:
  epochs: 128
  batch_size: 512  # each batch, all samples are used for rollouts (no wasted computation)
  samples_per_epoch: 8192
  use_tensorboard: true
  historical_opponent_prob: 0.6  # 60% of rollouts use historical vs current; 40% self-play
  checkpoint_dirs:
    - "./ckpts/bp_agent-trueskill"  # directories to scan for historical checkpoints
